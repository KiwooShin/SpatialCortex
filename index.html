<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLAM AR Visualizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0e0e8;
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  canvas { display: block; }

  /* HUD overlay */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 20px 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }

  #hud > * { pointer-events: auto; }

  .hud-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(100, 180, 255, 0.3);
  }

  .hud-subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #6a7090;
    margin-top: 4px;
  }

  /* Stats panel */
  .stats-panel {
    background: rgba(12, 12, 20, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(100, 180, 255, 0.12);
    border-radius: 10px;
    padding: 14px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.8;
    min-width: 200px;
  }

  .stats-panel .label { color: #5a6080; }
  .stats-panel .value { color: #a0b8e0; }
  .stats-panel .value.highlight { color: #64b4ff; }

  /* Playback bar */
  #playback {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 16px 28px 24px;
    background: linear-gradient(transparent, rgba(10, 10, 15, 0.95));
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  #playback button {
    background: rgba(100, 180, 255, 0.12);
    border: 1px solid rgba(100, 180, 255, 0.25);
    color: #64b4ff;
    border-radius: 6px;
    padding: 6px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  #playback button:hover {
    background: rgba(100, 180, 255, 0.22);
    border-color: rgba(100, 180, 255, 0.5);
  }

  #playback button.active {
    background: rgba(100, 180, 255, 0.3);
    color: #fff;
  }

  #timeline {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: rgba(100, 180, 255, 0.15);
    outline: none;
  }

  #timeline::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #64b4ff;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(100, 180, 255, 0.5);
  }

  #frame-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #6a7090;
    min-width: 90px;
    text-align: right;
  }

  /* Keyboard hint */
  #keyhints {
    position: fixed;
    bottom: 80px;
    right: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #3a4060;
    text-align: right;
    line-height: 1.8;
    z-index: 10;
  }

  kbd {
    display: inline-block;
    background: rgba(100, 180, 255, 0.08);
    border: 1px solid rgba(100, 180, 255, 0.15);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 10px;
    color: #5a6888;
  }

  /* Loading screen */
  #loading {
    position: fixed;
    inset: 0;
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    transition: opacity 0.5s;
  }

  #loading.hidden { opacity: 0; pointer-events: none; }

  .loading-spinner {
    width: 32px; height: 32px;
    border: 2px solid rgba(100, 180, 255, 0.15);
    border-top-color: #64b4ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #5a6888;
  }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading SLAM data…</div>
</div>

<!-- HUD -->
<div id="hud">
  <div>
    <div class="hud-title">SLAM AR Visualizer</div>
    <div class="hud-subtitle" id="dataset-name">Loading…</div>
  </div>
  <div class="stats-panel">
    <div><span class="label">Points  </span><span class="value" id="stat-points">—</span></div>
    <div><span class="label">Frames  </span><span class="value" id="stat-frames">—</span></div>
    <div><span class="label">Keyframes </span><span class="value highlight" id="stat-kf">—</span></div>
    <div><span class="label">Position </span><span class="value" id="stat-pos">—</span></div>
  </div>
</div>

<!-- Keyboard hints -->
<div id="keyhints">
  <kbd>Space</kbd> play/pause &nbsp;
  <kbd>←</kbd><kbd>→</kbd> step &nbsp;
  <kbd>P</kbd> points &nbsp;
  <kbd>T</kbd> trajectory &nbsp;
  <kbd>F</kbd> frustum &nbsp;
  <kbd>C</kbd> color mode
</div>

<!-- Playback -->
<div id="playback">
  <button id="btn-play">▶ Play</button>
  <input type="range" id="timeline" min="0" max="1" step="1" value="0">
  <span id="frame-counter">0 / 0</span>
  <button id="btn-points" class="active">Points</button>
  <button id="btn-traj" class="active">Trajectory</button>
  <button id="btn-frustum" class="active">Frustum</button>
</div>

<!-- Three.js container -->
<div id="canvas-container"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.module.min.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─── Inline OrbitControls (minimal) ────────────────────────────
// We load OrbitControls via a dynamic import from CDN
const OrbitControlsModule = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js');
const OrbitControls = OrbitControlsModule.OrbitControls;

// ─── Scene setup ───────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x0a0a0f);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.04);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(5, 4, 5);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.zoomSpeed = 0.8;

// ─── Lights & grid ────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambientLight);

// Ground grid
const gridHelper = new THREE.GridHelper(20, 40, 0x1a1a2e, 0x12121f);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.4;
scene.add(gridHelper);

// Axis indicator (small, at origin)
const axisHelper = new THREE.AxesHelper(0.5);
scene.add(axisHelper);

// ─── Data containers ──────────────────────────────────────────
let slamData = null;
let pointCloudObj = null;
let trajectoryLine = null;
let keyframeMarkers = null;
let frustumObj = null;

let currentFrame = 0;
let isPlaying = false;
let playSpeed = 1;
let showPoints = true;
let showTrajectory = true;
let showFrustum = true;
let colorMode = 0; // 0=height, 1=confidence, 2=uniform

// ─── Point cloud builder ──────────────────────────────────────
function buildPointCloud(points) {
  const count = points.length;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const confidences = new Float32Array(count);

  // Find Y bounds for height coloring
  let minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < count; i++) {
    const y = points[i].position[1];
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  }
  const rangeY = maxY - minY || 1;

  for (let i = 0; i < count; i++) {
    const p = points[i];
    positions[i * 3] = p.position[0];
    positions[i * 3 + 1] = p.position[1];
    positions[i * 3 + 2] = p.position[2];
    confidences[i] = p.confidence || 0.5;

    // Height-based color (blue low → cyan mid → white high)
    const t = (p.position[1] - minY) / rangeY;
    colors[i * 3] = 0.2 + t * 0.6;
    colors[i * 3 + 1] = 0.4 + t * 0.5;
    colors[i * 3 + 2] = 0.9;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('confidence', new THREE.BufferAttribute(confidences, 1));

  const material = new THREE.PointsMaterial({
    size: 0.025,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    sizeAttenuation: true,
    depthWrite: false,
  });

  return new THREE.Points(geometry, material);
}

function applyColorMode(points, mode) {
  if (!pointCloudObj) return;
  const colors = pointCloudObj.geometry.attributes.color;
  const positions = pointCloudObj.geometry.attributes.position;
  const confs = pointCloudObj.geometry.attributes.confidence;
  const count = positions.count;

  let minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < count; i++) {
    const y = positions.getY(i);
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  }
  const rangeY = maxY - minY || 1;

  for (let i = 0; i < count; i++) {
    if (mode === 0) {
      // Height
      const t = (positions.getY(i) - minY) / rangeY;
      colors.setXYZ(i, 0.2 + t * 0.6, 0.4 + t * 0.5, 0.9);
    } else if (mode === 1) {
      // Confidence (red=low, green=high)
      const c = confs.getX(i);
      colors.setXYZ(i, 1 - c, c, 0.3);
    } else {
      // Uniform cyan
      colors.setXYZ(i, 0.39, 0.71, 1.0);
    }
  }
  colors.needsUpdate = true;
}

// ─── Trajectory builder ───────────────────────────────────────
function buildTrajectory(trajectory) {
  const points = trajectory.map(f => new THREE.Vector3(f.position[0], f.position[1], f.position[2]));

  // Trajectory line
  const lineGeom = new THREE.BufferGeometry().setFromPoints(points);
  const lineMat = new THREE.LineBasicMaterial({
    color: 0x64b4ff,
    transparent: true,
    opacity: 0.6,
    linewidth: 1,
  });
  const line = new THREE.Line(lineGeom, lineMat);

  // Keyframe markers
  const kfPositions = [];
  for (const f of trajectory) {
    if (f.is_keyframe) {
      kfPositions.push(f.position[0], f.position[1], f.position[2]);
    }
  }
  const kfGeom = new THREE.BufferGeometry();
  kfGeom.setAttribute('position', new THREE.Float32BufferAttribute(kfPositions, 3));
  const kfMat = new THREE.PointsMaterial({
    size: 0.06,
    color: 0xffaa44,
    transparent: true,
    opacity: 0.9,
    sizeAttenuation: true,
  });
  const kfPoints = new THREE.Points(kfGeom, kfMat);

  return { line, keyframes: kfPoints };
}

// ─── Camera frustum builder ───────────────────────────────────
function buildFrustum() {
  const w = 0.15, h = 0.1, d = 0.25;
  const vertices = new Float32Array([
    // Pyramid edges from tip to base corners
    0, 0, 0, -w, -h, -d,
    0, 0, 0,  w, -h, -d,
    0, 0, 0,  w,  h, -d,
    0, 0, 0, -w,  h, -d,
    // Base rectangle
    -w, -h, -d,  w, -h, -d,
     w, -h, -d,  w,  h, -d,
     w,  h, -d, -w,  h, -d,
    -w,  h, -d, -w, -h, -d,
  ]);
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  const mat = new THREE.LineBasicMaterial({ color: 0x44ff88, transparent: true, opacity: 0.8 });
  return new THREE.LineSegments(geom, mat);
}

function updateFrustum(frameIdx) {
  if (!frustumObj || !slamData) return;
  const frame = slamData.trajectory[frameIdx];
  if (!frame) return;

  frustumObj.position.set(frame.position[0], frame.position[1], frame.position[2]);
  const q = frame.orientation;
  frustumObj.quaternion.set(q[1], q[2], q[3], q[0]); // Three.js: (x,y,z,w)
}

// ─── Load data ────────────────────────────────────────────────
async function loadData(url) {
  const resp = await fetch(url);
  return resp.json();
}

async function init() {
  // Try loading sample data
  try {
    slamData = await loadData('data/aria_vrs.json');
  } catch (e) {
    console.error('Failed to load sample data:', e);
    document.querySelector('.loading-text').textContent = 'Error loading data';
    return;
  }

  // Build scene objects
  if (slamData.point_cloud.length > 0) {
    pointCloudObj = buildPointCloud(slamData.point_cloud);
    scene.add(pointCloudObj);
  }

  if (slamData.trajectory.length > 0) {
    const { line, keyframes } = buildTrajectory(slamData.trajectory);
    trajectoryLine = line;
    keyframeMarkers = keyframes;
    scene.add(trajectoryLine);
    scene.add(keyframeMarkers);

    frustumObj = buildFrustum();
    scene.add(frustumObj);
    updateFrustum(0);

    // Center camera on trajectory
    const midIdx = Math.floor(slamData.trajectory.length / 2);
    const mid = slamData.trajectory[midIdx].position;
    controls.target.set(mid[0], mid[1], mid[2]);
  }

  // Update UI
  const meta = slamData.metadata;
  document.getElementById('dataset-name').textContent =
    `${meta.dataset} / ${meta.sequence}`;
  document.getElementById('stat-points').textContent =
    meta.num_points.toLocaleString();
  document.getElementById('stat-frames').textContent =
    meta.num_frames.toLocaleString();
  document.getElementById('stat-kf').textContent =
    slamData.trajectory.filter(f => f.is_keyframe).length;

  const timeline = document.getElementById('timeline');
  timeline.max = Math.max(0, slamData.trajectory.length - 1);

  document.getElementById('frame-counter').textContent =
    `0 / ${slamData.trajectory.length}`;

  // Hide loading
  document.getElementById('loading').classList.add('hidden');
}

// ─── Playback ─────────────────────────────────────────────────
function setFrame(idx) {
  if (!slamData) return;
  currentFrame = Math.max(0, Math.min(idx, slamData.trajectory.length - 1));
  updateFrustum(currentFrame);
  document.getElementById('timeline').value = currentFrame;
  document.getElementById('frame-counter').textContent =
    `${currentFrame} / ${slamData.trajectory.length}`;

  const pos = slamData.trajectory[currentFrame]?.position;
  if (pos) {
    document.getElementById('stat-pos').textContent =
      `${pos[0].toFixed(2)}, ${pos[1].toFixed(2)}, ${pos[2].toFixed(2)}`;
  }
}

let lastPlayTime = 0;
function updatePlayback(time) {
  if (isPlaying && time - lastPlayTime > 50) {
    lastPlayTime = time;
    if (currentFrame < slamData.trajectory.length - 1) {
      setFrame(currentFrame + playSpeed);
    } else {
      setFrame(0); // loop
    }
  }
}

// ─── Controls ─────────────────────────────────────────────────
document.getElementById('btn-play').addEventListener('click', () => {
  isPlaying = !isPlaying;
  document.getElementById('btn-play').textContent = isPlaying ? '⏸ Pause' : '▶ Play';
  document.getElementById('btn-play').classList.toggle('active', isPlaying);
});

document.getElementById('timeline').addEventListener('input', (e) => {
  setFrame(parseInt(e.target.value));
});

document.getElementById('btn-points').addEventListener('click', (e) => {
  showPoints = !showPoints;
  if (pointCloudObj) pointCloudObj.visible = showPoints;
  e.target.classList.toggle('active', showPoints);
});

document.getElementById('btn-traj').addEventListener('click', (e) => {
  showTrajectory = !showTrajectory;
  if (trajectoryLine) trajectoryLine.visible = showTrajectory;
  if (keyframeMarkers) keyframeMarkers.visible = showTrajectory;
  e.target.classList.toggle('active', showTrajectory);
});

document.getElementById('btn-frustum').addEventListener('click', (e) => {
  showFrustum = !showFrustum;
  if (frustumObj) frustumObj.visible = showFrustum;
  e.target.classList.toggle('active', showFrustum);
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    document.getElementById('btn-play').click();
  } else if (e.code === 'ArrowRight') {
    setFrame(currentFrame + 1);
  } else if (e.code === 'ArrowLeft') {
    setFrame(currentFrame - 1);
  } else if (e.code === 'KeyP') {
    document.getElementById('btn-points').click();
  } else if (e.code === 'KeyT') {
    document.getElementById('btn-traj').click();
  } else if (e.code === 'KeyF') {
    document.getElementById('btn-frustum').click();
  } else if (e.code === 'KeyC') {
    colorMode = (colorMode + 1) % 3;
    applyColorMode(slamData?.point_cloud, colorMode);
  }
});

// ─── Resize ───────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Animation loop ───────────────────────────────────────────
function animate(time) {
  requestAnimationFrame(animate);
  controls.update();
  updatePlayback(time);
  renderer.render(scene, camera);
}

// ─── Go ───────────────────────────────────────────────────────
await init();
animate(0);
</script>
</body>
</html>
